# Default settings. Paths are relative to the repository root.
seed: 20260929

paths:
  hrsid_root: data/hrsid/HRSID_JPG
  splits: splits/splits.json
  scenes: splits/scenes.json
  detections_dir: data/detections
  detector_dir: outputs/detector
  detector_report: outputs/detector_report.json

detector:
  # SPEC §4.3: torchvision fasterrcnn_resnet50_fpn from COCO weights, 2 classes (background, ship)
  epochs: 20
  batch_size: 4
  lr: 0.01
  momentum: 0.9
  weight_decay: 1.0e-4
  warmup_iters: 500        # linear warm-up, then cosine decay to 0 (not specified in SPEC)
  grad_clip: 10.0          # max grad norm (not specified in SPEC; guards lr 0.01 at batch 4)
  amp: true
  num_workers: 6
  min_size: 800            # input kept at the native 800x800
  max_size: 800
  nms_iou: 0.5
  detections_per_img: 300  # images hold up to 163 ships
  raw_score_thresh: 0.05   # lowest score kept for AP50 and the F1 threshold search
  score_threshold: 0.96    # set from det_val F1 by `sarqa detector infer`, then frozen

tools:
  image_size: 800          # all HRSID images are 800x800 (docs/data_notes.md §2)
  edge_margin_px: 20       # "near the edge": a box side within this many px of the border (SPEC §5.1, confirm on dev)
  distance_decimals: 1     # centre-to-centre distance rounding (SPEC §5.1)
  image_cache: 64          # decoded grayscale images kept in memory
