# The 11 experiment conditions (SPEC §9). 11 x 360 test questions = 3,960 runs.
# `input`: label | detected | injected:<kind> (label + one error kind) | corrected:<kind> (detected + one fixed).
# `repeat` feeds the seed rule seed = hash(qid, repeat); only condition 3 re-runs with repeat 1.
questions_per_split:
  test: 360
  dev: 90

conditions:
  - {id: 1,  method: stepwise, input: label,              repeat: 0}
  - {id: 2,  method: stepwise, input: detected,           repeat: 0}
  - {id: 3,  method: stepwise, input: label,              repeat: 1}
  - {id: 4,  method: batch,    input: label,              repeat: 0}
  - {id: 5,  method: batch,    input: detected,           repeat: 0}
  - {id: 6,  method: stepwise, input: "injected:miss",    repeat: 0}
  - {id: 7,  method: stepwise, input: "injected:fp",      repeat: 0}
  - {id: 8,  method: stepwise, input: "injected:loc",     repeat: 0}
  - {id: 9,  method: stepwise, input: "corrected:miss",   repeat: 0}
  - {id: 10, method: stepwise, input: "corrected:fp",     repeat: 0}
  - {id: 11, method: stepwise, input: "corrected:loc",    repeat: 0}

# Order of execution (SPEC §9): group 1 = RQ1/RQ2, group 2 = re-run variability, group 3 = batch plan.
priority_groups:
  - [1, 2, 6, 7, 8, 9, 10, 11]
  - [3]
  - [4, 5]
